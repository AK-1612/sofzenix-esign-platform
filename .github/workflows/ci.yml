name: Sofzenix eSign Platform CI Pipeline

# ==============================================================================
# GITHUB ACTIONS CONTINUOUS INTEGRATION SCAFFOLD
# Runs linting, type-checking, backend builds, and AI checks on Pull Requests.
# ==============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND CHECKS
  # ----------------------------------------------------------------------------
  frontend-checks:
    name: Frontend Lint & Scaffold Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Validate Package JSON Syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('./frontend/package.json'))"
          echo "Frontend package.json validated successfully."

  # ----------------------------------------------------------------------------
  # 2. BACKEND CHECKS
  # ----------------------------------------------------------------------------
  backend-checks:
    name: Backend Scaffold & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Backend Directory Structure
        run: |
          test -d backend/identity
          test -d backend/documents
          test -d backend/generation
          test -d backend/esignature
          test -d backend/workflow
          test -d backend/ai
          test -d backend/communication
          test -d backend/integrations
          test -d backend/analytics
          test -d backend/billing
          echo "All 10 backend engineering module scaffolds present."

  # ----------------------------------------------------------------------------
  # 3. AI WORKSPACE CHECKS
  # ----------------------------------------------------------------------------
  ai-checks:
    name: AI Workspace Scaffold Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Verify AI Submodules
        run: |
          test -d ai/ocr
          test -d ai/classification
          test -d ai/extraction
          test -d ai/contract_analysis
          test -d ai/risk_detection
          test -d ai/smart_search
          test -d ai/assistant
          echo "All AI workspace submodules present."
