version: '3.8'

# ==============================================================================
# SOFZENIX ESIGN PLATFORM - LOCAL DEVELOPMENT DOCKER COMPOSE SCAFFOLD
# Note: This is an initial development infrastructure scaffold. Production deployments
# will use Kubernetes and helm charts as specified in docs/deployment/.
# ==============================================================================

services:
  # Frontend Web Application (Next.js / React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sofzenix-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - backend

  # Core Backend Application (Spring Boot Modular Service Gateway)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sofzenix-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_HOST=postgres
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - postgres
      - redis
      - kafka

  # AI Workspace Service (FastAPI Microservice)
  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: sofzenix-ai-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
    depends_on:
      - redis

  # Primary Relational Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: sofzenix-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sofzenix_esign
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Distributed Cache & Session Store (Redis)
  redis:
    image: redis:7-alpine
    container_name: sofzenix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Event Streaming Bus (Kafka & Zookeeper Scaffold)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: sofzenix-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: sofzenix-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

volumes:
  postgres_data:
  redis_data:
