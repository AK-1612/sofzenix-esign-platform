openapi: 3.0.3
info:
  title: Sofzenix eSign - Document Management API Specification (Module 2)
  description: OpenAPI 3.0 REST API specification for Document Upload, Versioning, Metadata, Folders, and Lifecycle Search.
  version: 1.0.0
servers:
  - url: https://api.sofzenix-esign.com/api/v1
    description: Production API Server
  - url: http://localhost:8080/api/v1
    description: Local Development Server

paths:
  /documents:
    post:
      summary: Upload a new document binary and metadata
      operationId: uploadDocument
      tags:
        - Document Management
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - title
              properties:
                file:
                  type: string
                  format: binary
                  description: Document binary payload (PDF, DOCX)
                title:
                  type: string
                  example: Master Services Agreement 2026
                description:
                  type: string
                  example: MSA for Client Acme Corp
                folderId:
                  type: string
                  format: uuid
                tags:
                  type: array
                  items:
                    type: string
                  example: ["legal", "contract", "acme"]
      responses:
        '201':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /documents/{id}:
    get:
      summary: Get document metadata by ID
      operationId: getDocumentById
      tags:
        - Document Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

    patch:
      summary: Update document metadata
      operationId: updateDocumentMetadata
      tags:
        - Document Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentMetadataUpdateDTO'
      responses:
        '200':
          description: Metadata updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'

    delete:
      summary: Soft delete document
      operationId: deleteDocument
      tags:
        - Document Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Document soft deleted

  /documents/{id}/versions:
    get:
      summary: List all version snapshots of a document
      operationId: getDocumentVersions
      tags:
        - Document Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of document versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentVersion'

    post:
      summary: Upload a new version snapshot to an existing document
      operationId: createNewVersion
      tags:
        - Document Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                changeSummary:
                  type: string
                  example: Added revised indemnification clause
      responses:
        '201':
          description: New version created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'

  /documents/search:
    post:
      summary: Search and filter documents
      operationId: searchDocuments
      tags:
        - Document Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSearchFilterDTO'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentResponse'

components:
  schemas:
    DocumentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        folderId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [DRAFT, PENDING_REVIEW, APPROVED, SIGNING, SIGNED, VAULTED, EXPIRED, ARCHIVED]
        currentVersionNumber:
          type: integer
        currentVersionId:
          type: string
          format: uuid
        downloadUrl:
          type: string
        tags:
          type: array
          items:
            type: string
        retentionExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    DocumentMetadataUpdateDTO:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        folderId:
          type: string
          format: uuid
        status:
          type: string
        tags:
          type: array
          items:
            type: string

    DocumentVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        storageProvider:
          type: string
        storagePath:
          type: string
        fileName:
          type: string
        fileSizeBytes:
          type: integer
        checksumSha256:
          type: string
        changeSummary:
          type: string
        createdAt:
          type: string
          format: date-time

    DocumentSearchFilterDTO:
      type: object
      properties:
        query:
          type: string
        status:
          type: string
        folderId:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
        page:
          type: integer
        size:
          type: integer

  responses:
    400BadRequest:
      description: Invalid payload or validation error
    401Unauthorized:
      description: Missing or invalid JWT token
    404NotFound:
      description: Document resource not found
